[project]
name = "rag-enterprise-lab"
version = "0.1.0"
description = "Governed enterprise RAG lab"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn",
  "pydantic>=2",
  "pydantic-settings",
  "sqlalchemy>=2",
  "psycopg[binary]",
  "pgvector",
  "boto3",
  "httpx",
  "pyyaml",
  "openai>=3.19,<4",
  "anthropic>=1.8,<2"
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff", "mypy", "types-PyYAML"]
ingestion = ["docling"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "integration: requires real Cloudflare R2 credentials; skipped when absent",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
